# hermes-os -- Umgebung für alle systemd-User-Units des Nutzers.
# Gilt für die mitgelieferte hermes-gateway.service genauso wie für die
# Unit, die `hermes setup` selbst unter ~/.config/systemd/user anlegt, und
# für deren Cron- und Worker-Kinder.
#
# HERMES_LAZY_INSTALL_TARGET: Hermes' Mechanismus für versiegelte Images.
# Optionale Backends (Messaging-SDKs, Wake-Word, Cloud-Suche) werden dorthin
# nachinstalliert statt in die read-only Venv unter /usr.
HERMES_LAZY_INSTALL_TARGET=${HOME}/.hermes/lazy-packages
PYTHONDONTWRITEBYTECODE=1
