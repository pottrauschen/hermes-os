# hermes-os -- tmpfiles-Einträge für Verzeichnisse, die der Image-Build als
# Cache-Mountpunkte anlegt (Dockerfile: --mount=type=cache). Ohne diese
# Zeilen meldet `bootc container lint` var-tmpfiles, weil Inhalt unter /var
# im Image nicht deklariert ist.
d /var/cache/libdnf5 0755 root root - -
d /var/cache/uv      0755 root root - -
