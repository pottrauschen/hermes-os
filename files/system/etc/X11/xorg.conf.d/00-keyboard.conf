# hermes-os: Tastatur ab Werk, im Format von `localectl set-x11-keymap`.
# systemd-localed liest die Datei und meldet sie als X11 Layout; KWin folgt
# ihr auf Wayland, solange kxkbrc keine eigene Belegung setzt, und SDDM nimmt
# sie für den Anmeldebildschirm. `localectl set-x11-keymap` überschreibt sie.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "de"
EndSection
