---
# hermes-os -- Image-Build (Muster: querencia-linux, AlmaLinux atomic-ci v11,
# das für jedes bootc-Image funktioniert). Basis-Signatur wird gegen
# aurora-cosign.pub (Universal Blue) geprüft.
name: Build image
on:
  pull_request:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**/README.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:
  schedule:
    # Wöchentlich, damit Aurora-Updates ohne Commit ins Image kommen.
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      LATEST_TAG: ${{ steps.set.outputs.LATEST_TAG }}
      REGISTRY: ${{ steps.set.outputs.REGISTRY }}
      REGISTRY_USER: ${{ steps.set.outputs.REGISTRY_USER }}
      PLATFORMS: ${{ steps.set.outputs.PLATFORMS }}
      IMAGE_PATH: ${{ steps.set.outputs.IMAGE_PATH }}
      IMAGE_NAME: ${{ steps.set.outputs.IMAGE_NAME }}
      IMAGE_REF: ${{ steps.set.outputs.IMAGE_REF }}
      IS_SIGNED: ${{ steps.set.outputs.IS_SIGNED }}
    steps:
      - name: Checkout github actions
        uses: actions/checkout@v4

      - name: Set environment variables
        uses: ./.github/actions/config
        id: set
        with:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

  # ===========================================================================
  # AMD / Intel (Standard)
  # ===========================================================================
  build-image:
    name: Build image (AMD)
    uses: AlmaLinux/atomic-ci/.github/workflows/build-image.yml@v11
    needs: set-env
    with:
      image-description: "hermes-os -- Atomic KDE desktop with Hermes Agent as a system component (Aurora DX)"
      containerfile: Dockerfile
      image-name: ${{ needs.set-env.outputs.IMAGE_NAME }}
      variant: ""
      previous-image: "${{ needs.set-env.outputs.REGISTRY }}/${{ needs.set-env.outputs.IMAGE_PATH }}/${{ needs.set-env.outputs.IMAGE_NAME }}:latest"
      upstream-public-key: aurora-cosign.pub
      platforms: ${{ needs.set-env.outputs.PLATFORMS }}
      skip-maximize-build-space: false
      generate-sbom: true
      image-path: ${{ needs.set-env.outputs.IMAGE_PATH }}
      REGISTRY: ${{ needs.set-env.outputs.REGISTRY }}
      REGISTRY_USER: ${{ needs.set-env.outputs.REGISTRY_USER }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    permissions:
      contents: read
      packages: write
      id-token: write

  test-image:
    name: Test image (AMD)
    runs-on: ubuntu-latest
    needs: [set-env, build-image]
    env:
      IMAGE_REF: "${{ needs.build-image.outputs.image-ref }}@${{ needs.build-image.outputs.digest }}"
    steps:
      - name: Login to Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | podman login -u ${{ needs.set-env.outputs.REGISTRY_USER }} --password-stdin ${{ needs.set-env.outputs.REGISTRY }}

      - name: Test container
        run: |
          cat << 'EOF' > /tmp/test.sh
          set -ex
          cat /etc/os-release
          bootc -V
          HERMES_HOME=/tmp/h hermes --version
          test -f /usr/share/hermes-os/plugins/hermes_os/plugin.yaml
          EOF
          podman run --rm -v /tmp/test.sh:/tmp/test.sh ${{ env.IMAGE_REF }} /bin/bash /tmp/test.sh

  promote-image:
    name: Promote image (AMD)
    needs: [set-env, build-image, test-image]
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: AlmaLinux/atomic-ci/.github/workflows/retag-image.yml@v11
    with:
      image: ${{ needs.build-image.outputs.image-ref }}
      digest: ${{ needs.build-image.outputs.digest }}
      tag: |
        ${{ needs.set-env.outputs.LATEST_TAG }}
        ${{ needs.build-image.outputs.version }}
      REGISTRY: ${{ needs.set-env.outputs.REGISTRY }}
      REGISTRY_USER: ${{ needs.set-env.outputs.REGISTRY_USER }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: write

  # ===========================================================================
  # NVIDIA
  # ===========================================================================
  build-image-nvidia:
    name: Build image (NVIDIA)
    uses: AlmaLinux/atomic-ci/.github/workflows/build-image.yml@v11
    needs: set-env
    with:
      image-description: "hermes-os NVIDIA -- Atomic KDE desktop with Hermes Agent as a system component (Aurora DX, nvidia-open)"
      containerfile: Dockerfile
      image-name: "${{ needs.set-env.outputs.IMAGE_NAME }}-nvidia"
      variant: "nvidia"
      previous-image: "${{ needs.set-env.outputs.REGISTRY }}/${{ needs.set-env.outputs.IMAGE_PATH }}/${{ needs.set-env.outputs.IMAGE_NAME }}-nvidia:latest"
      upstream-public-key: aurora-cosign.pub
      platforms: ${{ needs.set-env.outputs.PLATFORMS }}
      skip-maximize-build-space: false
      generate-sbom: true
      image-path: ${{ needs.set-env.outputs.IMAGE_PATH }}
      REGISTRY: ${{ needs.set-env.outputs.REGISTRY }}
      REGISTRY_USER: ${{ needs.set-env.outputs.REGISTRY_USER }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    permissions:
      contents: read
      packages: write
      id-token: write

  promote-image-nvidia:
    name: Promote image (NVIDIA)
    needs: [set-env, build-image-nvidia]
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: AlmaLinux/atomic-ci/.github/workflows/retag-image.yml@v11
    with:
      image: ${{ needs.build-image-nvidia.outputs.image-ref }}
      digest: ${{ needs.build-image-nvidia.outputs.digest }}
      tag: |
        ${{ needs.set-env.outputs.LATEST_TAG }}
        ${{ needs.build-image-nvidia.outputs.version }}
      REGISTRY: ${{ needs.set-env.outputs.REGISTRY }}
      REGISTRY_USER: ${{ needs.set-env.outputs.REGISTRY_USER }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: write
